name: Node Check

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # ← TAMBAHKAN STEP INI
      - name: Install dependencies
        run: npm install || echo "No dependencies to install"
      
      - name: Check L57 file
        run: |
          echo "Checking: Bot_Pembelajaran_ID_JUMP_AUDIT_20260927_L57_CURRICULUM_RELATION_ID_EDIT_FIX.js"
          node --check Bot_Pembelajaran_ID_JUMP_AUDIT_20260927_L57_CURRICULUM_RELATION_ID_EDIT_FIX.js
          echo "✓ L57 syntax check passed!"
